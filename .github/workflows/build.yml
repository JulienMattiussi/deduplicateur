name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ================================================================
  # Purge des assets de la rolling release "latest" avant chaque build sur main.
  # Sans ca, softprops/action-gh-release n'ecrase que les fichiers au nom identique :
  # un bump de version laisse les anciens fichiers orphelins dans la release.
  # Tourne uniquement sur main ; les tags utilisent une release dediee (v*).
  # build depend de ce job pour eviter une race avec la matrice Linux/Windows.
  # ================================================================
  purge-latest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete all assets from latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=$(gh release view latest --repo ${{ github.repository }} --json assets -q '.assets[].name' 2>/dev/null || true)
          if [ -n "$ASSETS" ]; then
            echo "$ASSETS" | while IFS= read -r name; do
              echo "Deleting asset: $name"
              gh release delete-asset latest "$name" --yes --repo ${{ github.repository }} || true
            done
          else
            echo "No latest release or no assets to delete."
          fi

  # ================================================================
  # Job principal : Windows + Linux, chaque push sur main et chaque tag
  # ================================================================
  build:
    needs: [purge-latest]
    if: ${{ always() && (needs.purge-latest.result == 'success' || needs.purge-latest.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-latest
            bundles: deb,appimage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            squashfs-tools \
            libmpv-dev

      # Sur Windows : telecharge libmpv-2.dll + mpv.lib + headers pour le build natif
      # (Phase 30). Sur Linux le paquet libmpv-dev fait office d'equivalent et expose
      # mpv.pc pour pkg-config.
      - name: Download libmpv (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # GITHUB_TOKEN authentifie l'appel a api.github.com (sinon rate limit
        # non-authentifie = 60 req/h par IP partagee du runner, intermittence
        # 403 sur les builds tags qui suivent un build main de pres).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/download-mpv.sh

      - name: Set LIBMPV_PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBMPV_PATH=$(realpath src-tauri/binaries)" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      # ================================================================
      # BUILD LIGHT (aucun binaire bundte - fpcalc/ffmpeg fournis par le systeme)
      # ================================================================

      - name: Build light
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      # softprops/action-gh-release met a jour la release mais ne deplace pas le tag git
      # quand il existe deja. Sans ca, les archives "Source code" attachees a la release "latest"
      # restent figees sur le commit du premier push. On force le tag a pointer sur HEAD ici,
      # uniquement sur Linux pour eviter une race avec le job Windows en parallele.
      - name: Move latest tag to current commit
        if: github.ref == 'refs/heads/main' && runner.os == 'Linux'
        run: |
          git tag -f latest
          git push origin -f latest

      - name: Publish rolling release Windows light (latest)
        if: github.ref == 'refs/heads/main' && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dernière version (main)
          prerelease: true
          files: |
            src-tauri/target/release/deduplicateur.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish tagged release Windows light
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/deduplicateur.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish rolling release Linux light (latest)
        if: github.ref == 'refs/heads/main' && runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dernière version (main)
          prerelease: true
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

      - name: Publish tagged release Linux light
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

      # ================================================================
      # BUILD FULL (fpcalc + ffmpeg + ffprobe) - tags uniquement
      # Pas d'upload-artifact : publication directe dans la release GitHub.
      # ================================================================

      - name: Download fpcalc + ffmpeg + ffprobe (full, tags uniquement)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TARGET_TRIPLE="$(rustc -Vv | grep '^host:' | awk '{print $2}')"
          BINARIES_DIR="src-tauri/binaries"
          # --- fpcalc ---
          VERSION="1.5.1"
          if [ "$RUNNER_OS" = "Windows" ]; then
            FPCALC_ARCHIVE="chromaprint-fpcalc-${VERSION}-windows-x86_64.zip"
            FPCALC_IN="chromaprint-fpcalc-${VERSION}-windows-x86_64/fpcalc.exe"
            FPCALC_EXT=".exe"
          else
            FPCALC_ARCHIVE="chromaprint-fpcalc-${VERSION}-linux-x86_64.tar.gz"
            FPCALC_IN="chromaprint-fpcalc-${VERSION}-linux-x86_64/fpcalc"
            FPCALC_EXT=""
          fi
          curl -fsSL "https://github.com/acoustid/chromaprint/releases/download/v${VERSION}/${FPCALC_ARCHIVE}" -o "$FPCALC_ARCHIVE"
          if [[ "$FPCALC_ARCHIVE" == *.zip ]]; then
            unzip -q "$FPCALC_ARCHIVE" "$FPCALC_IN"
          else
            tar -xzf "$FPCALC_ARCHIVE" "$FPCALC_IN"
          fi
          cp "$FPCALC_IN" "${BINARIES_DIR}/fpcalc-${TARGET_TRIPLE}${FPCALC_EXT}"
          chmod +x "${BINARIES_DIR}/fpcalc-${TARGET_TRIPLE}${FPCALC_EXT}"
          # --- ffmpeg + ffprobe ---
          mkdir -p ffmpeg_tmp
          if [ "$RUNNER_OS" = "Windows" ]; then
            BUILD="ffmpeg-master-latest-win64-lgpl"
            ARCHIVE="${BUILD}.zip"
            EXT=".exe"
          else
            BUILD="ffmpeg-master-latest-linux64-lgpl"
            ARCHIVE="${BUILD}.tar.xz"
            EXT=""
          fi
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${ARCHIVE}" -o "$ARCHIVE"
          if [[ "$ARCHIVE" == *.zip ]]; then
            unzip -q "$ARCHIVE" -d ffmpeg_tmp
          else
            tar -xf "$ARCHIVE" -C ffmpeg_tmp
          fi
          cp "ffmpeg_tmp/${BUILD}/bin/ffmpeg${EXT}" "${BINARIES_DIR}/ffmpeg-${TARGET_TRIPLE}${EXT}"
          cp "ffmpeg_tmp/${BUILD}/bin/ffprobe${EXT}" "${BINARIES_DIR}/ffprobe-${TARGET_TRIPLE}${EXT}"
          chmod +x "${BINARIES_DIR}/ffmpeg-${TARGET_TRIPLE}${EXT}" "${BINARIES_DIR}/ffprobe-${TARGET_TRIPLE}${EXT}"

      - name: Build full
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx tauri build --config src-tauri/tauri.conf.full.json --bundles ${{ matrix.bundles }}

      # productName="Deduplicateur-full" => fichiers nommés Deduplicateur-full_*
      - name: Publish tagged release Windows full
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/Deduplicateur-full_*.exe
            src-tauri/target/release/bundle/msi/Deduplicateur-full_*.msi

      - name: Publish tagged release Linux full
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/appimage/Deduplicateur-full_*.AppImage
            src-tauri/target/release/bundle/deb/Deduplicateur-full_*.deb

  # ================================================================
  # Job macOS : tag uniquement (runner 10x plus cher)
  # ================================================================
  build-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # macOS : libmpv via Homebrew. Build sans cette feature pour eviter d'avoir a
      # bundler libmpv dans le .dmg (les utilisateurs Mac sont rares + Phase 30 vise
      # surtout Windows). On garde la feature off explicitement.
      - name: Install npm dependencies
        run: npm ci

      - name: Build macOS (sans native-player)
        # Le double `--` est obligatoire : tauri-cli accepte ses propres options
        # apres le premier `--` (depuis npm), puis transmet ce qui suit le second
        # `--` a cargo. Sans ca, `--no-default-features` est lu par tauri-cli qui
        # ne le connait pas et echoue avec "unexpected argument".
        run: npm run tauri build -- --bundles dmg,app -- --no-default-features

      - name: Publish tagged release macOS
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
