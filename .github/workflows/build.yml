name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ================================================================
  # Job principal : Windows + Linux, chaque push sur main et chaque tag
  # ================================================================
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-latest
            bundles: deb,appimage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            squashfs-tools

      - name: Install npm dependencies
        run: npm ci

      # ================================================================
      # BUILD LIGHT (aucun binaire bundte - fpcalc/ffmpeg fournis par le systeme)
      # ================================================================

      - name: Build light
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      # softprops/action-gh-release met a jour la release mais ne deplace pas le tag git
      # quand il existe deja. Sans ca, les archives "Source code" attachees a la release "latest"
      # restent figees sur le commit du premier push. On force le tag a pointer sur HEAD ici,
      # uniquement sur Linux pour eviter une race avec le job Windows en parallele.
      - name: Move latest tag to current commit
        if: github.ref == 'refs/heads/main' && runner.os == 'Linux'
        run: |
          git tag -f latest
          git push origin -f latest

      - name: Publish rolling release Windows light (latest)
        if: github.ref == 'refs/heads/main' && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dernière version (main)
          prerelease: true
          files: |
            src-tauri/target/release/deduplicateur.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish tagged release Windows light
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/deduplicateur.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish rolling release Linux light (latest)
        if: github.ref == 'refs/heads/main' && runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dernière version (main)
          prerelease: true
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

      - name: Publish tagged release Linux light
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

      # ================================================================
      # BUILD FULL (fpcalc + ffmpeg + ffprobe) - tags uniquement
      # Pas d'upload-artifact : publication directe dans la release GitHub.
      # ================================================================

      - name: Download fpcalc + ffmpeg + ffprobe (full, tags uniquement)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TARGET_TRIPLE="$(rustc -Vv | grep '^host:' | awk '{print $2}')"
          BINARIES_DIR="src-tauri/binaries"
          # --- fpcalc ---
          VERSION="1.5.1"
          if [ "$RUNNER_OS" = "Windows" ]; then
            FPCALC_ARCHIVE="chromaprint-fpcalc-${VERSION}-windows-x86_64.zip"
            FPCALC_IN="chromaprint-fpcalc-${VERSION}-windows-x86_64/fpcalc.exe"
            FPCALC_EXT=".exe"
          else
            FPCALC_ARCHIVE="chromaprint-fpcalc-${VERSION}-linux-x86_64.tar.gz"
            FPCALC_IN="chromaprint-fpcalc-${VERSION}-linux-x86_64/fpcalc"
            FPCALC_EXT=""
          fi
          curl -fsSL "https://github.com/acoustid/chromaprint/releases/download/v${VERSION}/${FPCALC_ARCHIVE}" -o "$FPCALC_ARCHIVE"
          if [[ "$FPCALC_ARCHIVE" == *.zip ]]; then
            unzip -q "$FPCALC_ARCHIVE" "$FPCALC_IN"
          else
            tar -xzf "$FPCALC_ARCHIVE" "$FPCALC_IN"
          fi
          cp "$FPCALC_IN" "${BINARIES_DIR}/fpcalc-${TARGET_TRIPLE}${FPCALC_EXT}"
          chmod +x "${BINARIES_DIR}/fpcalc-${TARGET_TRIPLE}${FPCALC_EXT}"
          # --- ffmpeg + ffprobe ---
          mkdir -p ffmpeg_tmp
          if [ "$RUNNER_OS" = "Windows" ]; then
            BUILD="ffmpeg-master-latest-win64-lgpl"
            ARCHIVE="${BUILD}.zip"
            EXT=".exe"
          else
            BUILD="ffmpeg-master-latest-linux64-lgpl"
            ARCHIVE="${BUILD}.tar.xz"
            EXT=""
          fi
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${ARCHIVE}" -o "$ARCHIVE"
          if [[ "$ARCHIVE" == *.zip ]]; then
            unzip -q "$ARCHIVE" -d ffmpeg_tmp
          else
            tar -xf "$ARCHIVE" -C ffmpeg_tmp
          fi
          cp "ffmpeg_tmp/${BUILD}/bin/ffmpeg${EXT}" "${BINARIES_DIR}/ffmpeg-${TARGET_TRIPLE}${EXT}"
          cp "ffmpeg_tmp/${BUILD}/bin/ffprobe${EXT}" "${BINARIES_DIR}/ffprobe-${TARGET_TRIPLE}${EXT}"
          chmod +x "${BINARIES_DIR}/ffmpeg-${TARGET_TRIPLE}${EXT}" "${BINARIES_DIR}/ffprobe-${TARGET_TRIPLE}${EXT}"

      - name: Build full
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx tauri build --config src-tauri/tauri.conf.full.json --bundles ${{ matrix.bundles }}

      # productName="Deduplicateur-full" => fichiers nommés Deduplicateur-full_*
      - name: Publish tagged release Windows full
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/Deduplicateur-full_*.exe
            src-tauri/target/release/bundle/msi/Deduplicateur-full_*.msi

      - name: Publish tagged release Linux full
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/appimage/Deduplicateur-full_*.AppImage
            src-tauri/target/release/bundle/deb/Deduplicateur-full_*.deb

  # ================================================================
  # Job macOS : tag uniquement (runner 10x plus cher)
  # ================================================================
  build-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build macOS
        run: npm run tauri build -- --bundles dmg,app

      - name: Publish tagged release macOS
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
