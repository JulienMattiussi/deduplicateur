name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: macos-latest
            bundles: dmg,app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            squashfs-tools

      - name: Install npm dependencies
        run: npm ci

      - name: Download fpcalc
        shell: bash
        run: |
          VERSION="1.5.1"
          TARGET_TRIPLE="$(rustc -Vv | grep '^host:' | awk '{print $2}')"
          BINARIES_DIR="src-tauri/binaries"
          mkdir -p "$BINARIES_DIR"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ARCHIVE="chromaprint-fpcalc-${VERSION}-windows-x86_64.zip"
            FPCALC_IN_ARCHIVE="chromaprint-fpcalc-${VERSION}-windows-x86_64/fpcalc.exe"
            EXT=".exe"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ARCHIVE="chromaprint-fpcalc-${VERSION}-macos-x86_64.tar.gz"
            FPCALC_IN_ARCHIVE="chromaprint-fpcalc-${VERSION}-macos-x86_64/fpcalc"
            EXT=""
          else
            ARCHIVE="chromaprint-fpcalc-${VERSION}-linux-x86_64.tar.gz"
            FPCALC_IN_ARCHIVE="chromaprint-fpcalc-${VERSION}-linux-x86_64/fpcalc"
            EXT=""
          fi
          DEST="${BINARIES_DIR}/fpcalc-${TARGET_TRIPLE}${EXT}"
          URL="https://github.com/acoustid/chromaprint/releases/download/v${VERSION}/${ARCHIVE}"
          curl -fsSL "$URL" -o "$ARCHIVE"
          if [[ "$ARCHIVE" == *.zip ]]; then
            unzip -q "$ARCHIVE" "$FPCALC_IN_ARCHIVE"
          else
            tar -xzf "$ARCHIVE" "$FPCALC_IN_ARCHIVE"
          fi
          cp "$FPCALC_IN_ARCHIVE" "$DEST"
          chmod +x "$DEST"
          echo "fpcalc installé dans : $DEST"

      - name: Build
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      # --- Artifacts Windows ---

      - name: Upload Windows portable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: deduplicateur-windows-portable
          path: src-tauri/target/release/deduplicateur.exe
          if-no-files-found: error

      - name: Upload Windows NSIS
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: deduplicateur-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload Windows MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: deduplicateur-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      # --- Artifacts Linux ---

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: deduplicateur-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload Linux deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: deduplicateur-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

      # --- Release Windows ---

      - name: Publish rolling release Windows (latest)
        if: github.ref == 'refs/heads/main' && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dernière version (main)
          prerelease: true
          files: |
            src-tauri/target/release/deduplicateur.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish tagged release Windows
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/deduplicateur.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      # --- Artifacts macOS ---

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: deduplicateur-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: deduplicateur-macos-app
          path: src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn

      # --- Release Linux ---

      - name: Publish rolling release Linux (latest)
        if: github.ref == 'refs/heads/main' && runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dernière version (main)
          prerelease: true
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

      - name: Publish tagged release Linux
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

      # --- Release macOS ---

      - name: Publish rolling release macOS (latest)
        if: github.ref == 'refs/heads/main' && runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dernière version (main)
          prerelease: true
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg

      - name: Publish tagged release macOS
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
