[package]
name = "deduplicateur"
version = "0.1.0"
description = "Détecteur et suppresseur de fichiers en double"
authors = ["YavaDeus"]
edition = "2021"

[lib]
name = "deduplicateur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tokio = { version = "1", features = ["time"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rayon = "1"
trash = "5"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
image_hasher = "1"
image = "0.24"
base64 = "0.21"

[dev-dependencies]
tempfile = "3"
