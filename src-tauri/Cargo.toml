[package]
name = "deduplicateur"
version = "1.0.0"
description = "Détecteur et suppresseur de fichiers en double"
authors = ["YavaDeus"]
edition = "2021"

[lib]
name = "deduplicateur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Lecteur video natif libmpv pour les codecs non lus par la WebView (MPEG-4 ASP, WMV3,
# audio AC3/WMA/Vorbis, etc.). Active par defaut. Pour builder sans libmpv (review
# de code, environnement sans la lib), passer --no-default-features.
default = ["native-player"]
native-player = [
    "dep:libmpv2",
    "dep:raw-window-handle",
    "dep:windows",
    "dep:x11rb",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
libmpv2 = { version = "5", optional = true }
raw-window-handle = { version = "0.6", optional = true }
tokio = { version = "1", features = ["time", "net", "io-util", "rt-multi-thread"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
percent-encoding = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rayon = "1"
trash = "5"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
image_hasher = "1"
image = "0.24"
base64 = "0.21"
kamadak-exif = "0.5"
fs2 = "0.4"

[dependencies.zip]
version = "2"

[dependencies.tar]
version = "0.4"

[dependencies.flate2]
version = "1"

[dependencies.bzip2]
version = "0.4"

[dependencies.xz2]
version = "0.1"

[dependencies.zstd]
version = "0.13"

[dependencies.sevenz-rust2]
version = "0.21"

[dependencies.tempfile]
version = "3"

# Win32 : creation et redimensionnement de la HWND fille qui accueille mpv (Phase 30).
# Placer ces blocs target-specific APRES les [dependencies] et [dependencies.*] generaux,
# sinon TOML les rattache au mauvais target et "perd" les deps qui suivent.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
], optional = true }

# X11 : creation et redimensionnement de la sous-fenetre XID qui accueille mpv (Phase 30).
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", optional = true }

[dev-dependencies]
tempfile = "3"
